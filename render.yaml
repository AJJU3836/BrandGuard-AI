services:
  # ── Backend (FastAPI) ─────────────────────────────────────────────────────
  - type: web
    name: brandguard-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: brandguard-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-2.5-flash
      - key: PYTHON_VERSION
        value: 3.11.0

  # ── Frontend (React / Vite static site) ──────────────────────────────────
  - type: web
    name: brandguard-frontend
    runtime: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: brandguard-api
          type: web
          property: host

databases:
  - name: brandguard-db
    plan: free
    region: singapore
    databaseName: brandguard
    user: brandguard
